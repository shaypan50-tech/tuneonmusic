<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuneon | Платформа где ты сможешь послушать музыку</title>
    
    <!-- Favicon -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D0D0D;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* === ВЕРХНЯЯ ПАНЕЛЬ === */
        .header {
            position: fixed;
            top: 20px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            user-select: none;
            font-size: 16px;
            opacity: 0;
            animation: fadeIn 1.2s ease 0.8s forwards;
        }

        .header-logo {
            height: 28px;
            width: auto;
            display: block;
            flex-shrink: 0;
            vertical-align: middle;
        }

        /* Fallback, если картинка не загрузится */
        .header-logo::before {
            content: "🎵";
            font-size: 28px;
            display: none; /* скрыт по умолчанию, показываем только если картинка не загружена */
        }

        .header-divider {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            transform: translateY(1px);
        }

        .header-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 16px;
            transition: color 0.3s ease;
            letter-spacing: 0.2px;
            line-height: 1;
            display: flex;
            align-items: center;
            transform: translateY(1px);
        }
        .header-link:hover {
            color: #27A5E7;
        }

        /* === ЗАГРУЗЧИК === */
        .loader-ring {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2.4px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.95);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
            will-change: transform, opacity;
            opacity: 0;
            animation: 
                fadeIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards,
                spinTwoLoops 2.4s ease-in-out 0.8s infinite;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes spinTwoLoops {
            0%   { transform: rotate(0deg); }
            10%  { transform: rotate(0deg); }
            90%  { transform: rotate(720deg); }
            100% { transform: rotate(720deg); }
        }

        /* === НИЖНЯЯ ПАНЕЛЬ === */
        .bottom-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: auto;
            opacity: 0;
            animation: fadeIn 1.2s ease 0.8s forwards;
        }

        .top-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-box {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 48px;
            padding: 0 22px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.3px;
            user-select: none;
            white-space: nowrap;
            box-sizing: border-box;
        }
        .warning-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #e53e3e;
            flex-shrink: 0;
            line-height: 1;
        }
        .message-text {
            flex-shrink: 0;
        }

        .info-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }
        .info-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            font-size: 15px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
        }
        .tooltip::before { display: none; }
        .tooltip.show {
            opacity: 1;
            visibility: visible;
        }

        .extra-panel {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        margin-top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 22px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            box-sizing: border-box;
            margin-top: 0;
        }
        .bottom-bar.active .extra-panel {
            max-height: 300px;
            opacity: 1;
            padding: 18px 22px;
            margin-top: 10px;
        }

        .extra-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .extra-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 0.2px;
        }
        .extra-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #27A5E7;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 0 18px;
            height: 40px;
            border-radius: 10px;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
            flex: 1;
            min-width: 0;
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        .telegram-btn:hover {
            background: #1a7ab0;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .close-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
        }
        .close-btn:hover {
            color: #e53e3e;
            border-color: rgba(229, 62, 62, 0.3);
        }

        /* === АДАПТИВНОСТЬ === */
        @media (max-width: 1200px) {
            .header { left: 20px; gap: 8px; }
            .message-box { height: 46px; font-size: 15px; padding: 0 20px; }
            .info-btn { width: 46px; height: 46px; font-size: 20px; }
        }

        @media (max-width: 992px) {
            .header { top: 16px; left: 16px; gap: 8px; font-size: 15px; }
            .header-logo { height: 24px; }
            .header-divider { font-size: 16px; transform: translateY(1px); }
            .header-link { font-size: 15px; transform: translateY(1px); }
            .bottom-bar { bottom: 12px; }
            .message-box { height: 44px; font-size: 14px; padding: 0 18px; gap: 10px; }
            .warning-icon { font-size: 20px; }
            .info-btn { width: 44px; height: 44px; font-size: 18px; }
            .extra-panel { padding: 0 18px; border-radius: 10px; }
            .bottom-bar.active .extra-panel { padding: 16px 18px; margin-top: 8px; }
            .extra-text { font-size: 13px; }
            .telegram-btn { height: 36px; font-size: 13px; padding: 0 14px; }
            .telegram-btn i { font-size: 16px; }
            .close-btn { width: 36px; height: 36px; font-size: 18px; }
            .tooltip { font-size: 14px; padding: 8px 16px; }
        }

        @media (max-width: 768px) {
            .header { top: 14px; left: 14px; gap: 6px; font-size: 14px; }
            .header-logo { height: 20px; }
            .header-divider { font-size: 14px; transform: translateY(1px); }
            .header-link { font-size: 14px; transform: translateY(1px); }
            .bottom-bar { bottom: 10px; }
            .top-row { gap: 8px; }
            .message-box { height: 40px; font-size: 13px; padding: 0 16px; gap: 8px; border-radius: 10px; white-space: normal; max-width: 70%; }
            .warning-icon { font-size: 18px; }
            .info-btn { width: 40px; height: 40px; font-size: 17px; border-radius: 10px; }
            .extra-panel { padding: 0 16px; border-radius: 10px; }
            .bottom-bar.active .extra-panel { padding: 14px 16px; margin-top: 6px; max-height: 350px; }
            .extra-text { font-size: 12px; }
            .telegram-btn { height: 34px; font-size: 12px; padding: 0 12px; border-radius: 8px; }
            .telegram-btn i { font-size: 14px; }
            .close-btn { width: 34px; height: 34px; font-size: 16px; border-radius: 8px; }
            .tooltip { font-size: 13px; padding: 6px 14px; border-radius: 10px; }
        }

        @media (max-width: 480px) {
            .header { top: 12px; left: 12px; gap: 6px; font-size: 13px; }
            .header-logo { height: 18px; }
            .header-divider { font-size: 13px; transform: translateY(1px); }
            .header-link { font-size: 13px; transform: translateY(1px); }
            .bottom-bar { bottom: 8px; }
            .top-row { gap: 6px; }
            .message-box { height: 36px; font-size: 12px; padding: 0 12px; gap: 6px; border-radius: 8px; max-width: 65%; }
            .warning-icon { font-size: 16px; }
            .info-btn { width: 36px; height: 36px; font-size: 15px; border-radius: 8px; }
            .extra-panel { padding: 0 12px; border-radius: 8px; }
            .bottom-bar.active .extra-panel { padding: 12px 12px; margin-top: 6px; max-height: 400px; }
            .extra-text { font-size: 11px; }
            .extra-actions { gap: 6px; }
            .telegram-btn { height: 30px; font-size: 11px; padding: 0 10px; border-radius: 6px; }
            .telegram-btn i { font-size: 13px; }
            .close-btn { width: 30px; height: 30px; font-size: 14px; border-radius: 6px; }
            .tooltip { font-size: 12px; padding: 4px 10px; border-radius: 8px; left: calc(100% + 8px) !important; }
        }
    </style>
</head>
<body>

    <!-- === ВЕРХНИЙ ЛЕВЫЙ УГОЛ === -->
    <div class="header">
        <img src="tuneonfun3.png" alt="tuneon" class="header-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <span class="header-divider">|</span>
        <a href="https://t.me/tuneon_fun" class="header-link" target="_blank">Telegram</a>
    </div>

    <!-- Загрузчик -->
    <div class="loader-ring"></div>

    <!-- Нижняя панель -->
    <div class="bottom-bar" id="bottomBar">
        <div class="top-row" id="topRow">
            <div class="message-box">
                <span class="warning-icon"><i class="fas fa-circle-exclamation"></i></span>
                <span class="message-text">Извините, сайт в разработке.</span>
            </div>
            <button class="info-btn" id="infoBtn">
                <i class="fas fa-circle-info"></i>
            </button>
        </div>

        <div class="extra-panel" id="extraPanel">
            <div class="extra-content">
                <div class="extra-text">
                    Дополнительную информацию о разработке <strong style="color: #9900FF; font-weight: 700;">tuneon.fun</strong> вы сможете найти у нас в Telegram канале.
                </div>
                <div class="extra-actions">
                    <a href="https://t.me/tuneon_fun" class="telegram-btn" target="_blank">
                        <i class="fab fa-telegram-plane"></i> <span>TG: Channel</span>
                    </a>
                    <button class="close-btn" id="closeExtra">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">Раскрыть информацию.</div>

    <script>
        // Блокировка COOKIE
        (function blockCookies() {
            document.cookie.split(';').forEach(function(c) {
                if (c.trim()) {
                    const name = c.split('=')[0].trim();
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + window.location.hostname;
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
                }
            });
            Object.defineProperty(document, 'cookie', {
                get: function() { return ''; },
                set: function(value) { return; },
                configurable: true,
                enumerable: true
            });
        })();

        // ---- Основная логика ----
        (function() {
            const infoBtn = document.getElementById('infoBtn');
            const closeBtn = document.getElementById('closeExtra');
            const bottomBar = document.getElementById('bottomBar');
            const topRow = document.getElementById('topRow');
            const extraPanel = document.getElementById('extraPanel');
            const tooltip = document.getElementById('tooltip');

            let timer = null;
            let isOpen = false;

            function syncWidth() {
                if (topRow && extraPanel) {
                    extraPanel.style.width = topRow.offsetWidth + 'px';
                }
            }
            window.addEventListener('load', syncWidth);
            window.addEventListener('resize', syncWidth);

            function updateTooltipPosition() {
                if (!infoBtn || !tooltip) return;
                const rect = infoBtn.getBoundingClientRect();
                tooltip.style.left = (rect.right + 14) + 'px';
                tooltip.style.top = (rect.top + rect.height / 2) + 'px';
                tooltip.style.transform = 'translateY(-50%)';
            }

            function showTooltip() {
                updateTooltipPosition();
                tooltip.classList.add('show');
            }
            function hideTooltip() {
                if (timer) { clearTimeout(timer); timer = null; }
                tooltip.classList.remove('show');
            }

            infoBtn.addEventListener('mouseenter', () => {
                timer = setTimeout(showTooltip, 2000);
            });
            infoBtn.addEventListener('mouseleave', hideTooltip);

            window.addEventListener('resize', () => {
                if (tooltip.classList.contains('show')) updateTooltipPosition();
            });
            window.addEventListener('scroll', () => {
                if (tooltip.classList.contains('show')) updateTooltipPosition();
            });

            function togglePanel(open) {
                if (open === undefined) {
                    isOpen = !isOpen;
                } else {
                    isOpen = open;
                }
                if (isOpen) {
                    bottomBar.classList.add('active');
                    syncWidth();
                    hideTooltip();
                } else {
                    bottomBar.classList.remove('active');
                }
            }

            infoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                togglePanel();
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isOpen) togglePanel(false);
            });

            window.addEventListener('resize', () => {
                if (isOpen) syncWidth();
            });

            document.addEventListener('DOMContentLoaded', updateTooltipPosition);
        })();
    </script>
</body>
</html>
